# ============================================================
#  お知らせ台帳（Googleスプレッドシート）→ news.js の自動反映
#
#  ■ 動くきっかけ
#     ・10分おきに自動（事務ご担当者様は何も押さなくてよい）
#     ・台帳のメニュー【サイトに反映】から（事務ご担当者様はこちら）
#     ・GitHub の画面から手で実行（Actions → このワークフロー → Run workflow）
#
#  ■ 事前に1回だけ必要な設定
#     リポジトリの Settings → Secrets and variables → Actions に
#       名前: NEWS_SHEET_CSV_URL
#       値  : 台帳のCSVのURL
#     を登録してください。（手順は 01_引継ぎ・運用/台帳/ の手順書に記載）
#
#  ■ やっていること（3段）
#     1. 台帳のCSVを取り寄せる
#     2. 「写真／リンク／リンク2」に貼られたGoogleドライブのリンクを、
#        サイトの中のファイルに取り込む（写真は800×500に作り直す）
#     3. news.js を作り直して、変わっていれば公開する
#
#  ■ 安全の決めごと
#     ・台帳が取得できない／列が足りない／公開行が0件 のときは news.js を
#       書き換えません。サイトのお知らせが真っ白になることはありません。
#     ・写真の取り込みに失敗しても、お知らせの文章は必ず公開します。
#       （その行は標準の写真で出ます）
#     ・不備があったときは、出せる分を公開したうえで、
#       このワークフローを「失敗」にしてメールで知らせます。
# ============================================================

name: お知らせ台帳の反映

on:
  schedule:
    # 10分おき。GitHub側の混み具合で数分〜十数分ずれることがあります。
    - cron: "*/10 * * * *"
  workflow_dispatch:

# 同時に何本も走らせない（連続で保存されたときの衝突を防ぐ）
concurrency:
  group: news-from-sheet
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取り出す
        uses: actions/checkout@v7

      - name: Python を用意する
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 写真を扱う道具を入れる
        run: |
          python -m pip install --quiet --disable-pip-version-check \
            "Pillow==12.3.0" "pypdfium2==5.12.1"

      # --- 1段目 -------------------------------------------------
      # Secret を使うのはこの1か所だけにする（あとの段は手元のファイルを見る）
      - name: 台帳を取り寄せる
        env:
          NEWS_SHEET_CSV_URL: ${{ secrets.NEWS_SHEET_CSV_URL }}
        run: |
          python "tools/お知らせ台帳_取り寄せ.py" --out work/ledger_raw.csv

      # --- 2段目 -------------------------------------------------
      - name: 写真・チラシを取り込む
        id: photos
        run: |
          set +e
          python "tools/お知らせ写真_取り込み.py" \
            --csv work/ledger_raw.csv \
            --out-csv work/ledger.csv
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 取り込みが丸ごとこけても、お知らせの文章だけは必ず出す
          if [ ! -s work/ledger.csv ]; then
            echo "::warning::写真の取り込みができませんでした。お知らせの文章だけ公開します。"
            cp work/ledger_raw.csv work/ledger.csv
            echo "exit_code=2" >> "$GITHUB_OUTPUT"
          fi

      # --- 3段目 -------------------------------------------------
      - name: 台帳から news.js を作り直す
        id: build
        run: |
          set +e
          python "tools/お知らせ台帳_生成.py" --csv work/ledger.csv --out news.js
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 0 = 問題なし / 2 = 公開はするが注意あり / それ以外 = 中止（news.js はそのまま）
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "::error::台帳を読み取れませんでした。news.js は書き換えていません。"
            exit "$code"
          fi

      - name: 変わっていれば公開する
        run: |
          rm -rf work
          if [ -z "$(git status --porcelain -- news.js lp_image_assets_png/news)" ]; then
            echo "台帳に変更はありませんでした。公開はそのままです。"
            exit 0
          fi
          git config user.name "marusho-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.js lp_image_assets_png/news
          git commit -m "お知らせ台帳の内容を反映（$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M') 時点）"
          git push
          echo "公開しました。GitHub Pages への反映まで、さらに1〜2分かかります。"

      - name: 台帳に不備があったことを知らせる
        if: steps.build.outputs.exit_code == '2' || steps.photos.outputs.exit_code == '2'
        run: |
          echo "::error::台帳に不備がありました。出せる分だけを公開しています。上の『写真・チラシを取り込む』『台帳から news.js を作り直す』の記録を確認し、台帳を直してください。"
          exit 1
